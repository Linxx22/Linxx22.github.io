{% assign author = site.author %}
<div class="profile_box" itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ author.avatar }}" alt="{{ author.name }} ({{ author.name_zh }})" itemprop="image">
  </div>
  <div class="author__content">
    <h2 class="author__name" aria-label="{{ author.name }} ({{ author.name_zh }})">
      <span lang="en" itemprop="name">{{ author.name }}</span>
      <span lang="zh-CN" itemprop="alternateName">{{ author.name_zh }}</span>
    </h2>
    <p class="author__bio">{{ author.grade }}<br>{{ author.major }}<br>{{ author.department }}<br>{{ author.school }}</p>
  </div>
  <div class="author__urls-wrapper">
    <ul class="author__urls social-icons">
      {% for link in author.links %}
      <li><a href="{{ link.url }}"><i class="{{ link.icon }} fa-fw" aria-hidden="true"></i> {{ link.title }}</a></li>
      {% endfor %}
    </ul>
    <div class="author__urls_sm">
      {% for link in author.links %}
      <a href="{{ link.url }}" aria-label="{{ link.title }}" title="{{ link.title }}"><i class="{{ link.icon }} fa-fw" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
</div>
